<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevSoc | Events</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            colors: {
                primary:{400:'#a78bfa',500:'#8b5cf6',600:'#7c3aed'},
                dark:{900:'#0a0a0a',800:'#121212',700:'#1a1a1a'}
            },
            fontFamily:{
                mono:['"Fira Code"','monospace'],
                sans:['"Inter"','system-ui']
            }
        }
    }
}
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fira+Code&display=swap" rel="stylesheet">
<script src="https://unpkg.com/feather-icons"></script>
</head>

<body class="bg-dark-900 text-gray-100 font-sans overflow-x-hidden">

<!-- Navbar -->
<script src="components/navbar.js"></script>
<devsoc-navbar></devsoc-navbar>

<!-- Header -->
<section class="pt-32 pb-20 relative text-center">
    <div class="absolute inset-0 bg-primary-600/10"></div>
    <div class="relative z-10 max-w-4xl mx-auto px-4">
        <h1 class="text-5xl md:text-6xl font-bold mb-6">
            DevSoc <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary-400 to-primary-600">
                &lt;Events /&gt;
            </span>
        </h1>
        <p class="text-gray-400 text-lg">
            Workshops, hackathons, talks, and hands-on sessions hosted by DevSoc.
        </p>
    </div>
</section>

<!-- Events Timeline -->
<section class="pb-32">
<div class="max-w-5xl mx-auto px-4 relative">

    <!-- Vertical Line -->
    <div class="absolute left-4 top-0 bottom-0 w-px bg-primary-500/30 hidden sm:block"></div>

    <div id="events-container" class="space-y-12"></div>

</div>
</section>

<!-- CTA -->
<section class="py-24 bg-dark-800/40 border-t border-dark-700">
    <div class="max-w-4xl mx-auto text-center px-4">
        <h2 class="text-4xl md:text-5xl font-bold mb-6">
            Don’t miss the <span class="text-primary-500">next event</span>
        </h2>
        <p class="text-gray-400 mb-10">
            Follow DevSoc and stay updated with upcoming workshops and hackathons.
        </p>
        <a href="index.html#join"
           class="inline-flex items-center gap-2 px-8 py-4 bg-primary-600 rounded-lg font-semibold text-white hover:scale-105 transition">
            Join DevSoc
            <i data-feather="arrow-right"></i>
        </a>
    </div>
</section>

<!-- Footer -->
<script src="components/footer.js"></script>
<devsoc-footer></devsoc-footer>

<script>
feather.replace();

/* EVENTS DATA */
const events = [
    {
        title: "Intro to Web Development Workshop",
        date: "March 2025",
        type: "Workshop",
        description: "A beginner-friendly workshop covering HTML, CSS, and basic JavaScript."
    },
    {
        title: "Git & GitHub Bootcamp",
        date: "April 2025",
        type: "Bootcamp",
        description: "Hands-on session teaching version control, collaboration, and GitHub workflows."
    },
    {
        title: "DevSoc Hackathon",
        date: "June 2025",
        type: "Hackathon",
        description: "24-hour team-based hackathon focused on solving real-world problems."
    },
    {
        title: "AI & Machine Learning Talk",
        date: "August 2025",
        type: "Tech Talk",
        description: "An introduction to AI concepts, use cases, and career paths in ML."
    },
    {
        title: "Mobile App Development Session",
        date: "October 2025",
        type: "Workshop",
        description: "Building mobile applications using modern frameworks and tools."
    }
];

/* Render Events */
const container = document.getElementById("events-container");

events.forEach(event => {
    const div = document.createElement("div");
    div.className = "relative pl-10 sm:pl-16 group";
    div.innerHTML = `
        <div class="absolute left-2 top-4 w-4 h-4 rounded-full bg-primary-500 shadow-[0_0_15px_rgba(139,92,246,0.6)]"></div>

        <div class="bg-dark-800 border border-dark-700 rounded-2xl p-6 
                    group-hover:border-primary-500/50 
                    group-hover:shadow-[0_0_30px_rgba(139,92,246,0.2)]
                    transition-all">
            <div class="flex flex-wrap items-center gap-3 mb-3">
                <span class="text-sm font-mono text-primary-400">${event.type}</span>
                <span class="text-xs text-gray-500">${event.date}</span>
            </div>
            <h3 class="text-2xl font-semibold mb-2">${event.title}</h3>
            <p class="text-gray-400 text-sm">${event.description}</p>
        </div>
    `;
    container.appendChild(div);
});
</script>

</body>
</html>
