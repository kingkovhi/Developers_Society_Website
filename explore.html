<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevSoc | Explore Projects</title>
    <meta name="description" content="Explore all projects built by DevSoc members – web, mobile, AI, and more.">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b5cf6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='16 18 22 12 16 6'%3E%3C/polyline%3E%3Cpolyline points='8 6 2 12 8 18'%3E%3C/polyline%3E%3C/svg%3E">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                        },
                        dark: {
                            900: '#0a0a0a',
                            800: '#121212',
                            700: '#1a1a1a',
                        }
                    },
                    fontFamily: {
                        mono: ['"Fira Code"', 'monospace'],
                        sans: ['"Inter"', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Fira+Code&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-dark-900 text-gray-100 font-sans overflow-x-hidden">

    <!-- Navbar -->
    <script src="components/navbar.js"></script>
    <devsoc-navbar></devsoc-navbar>

    <!-- Header -->
    <section class="pt-32 pb-20 relative overflow-hidden">
        <div class="absolute inset-0 bg-primary-600/10"></div>

        <div class="relative z-10 max-w-6xl mx-auto px-4 text-center">
            <h1 class="text-5xl md:text-6xl font-bold mb-6">
                Explore <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary-400 to-primary-600">&lt;Projects /&gt;</span>
            </h1>
            <p class="text-gray-400 text-lg max-w-2xl mx-auto">
                A collection of projects built by DevSoc members — from hackathon experiments to real-world solutions.
            </p>
        </div>
    </section>

    <!-- Filters -->
    <section class="pb-12">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex flex-wrap gap-3 justify-center">
                <button class="filter-btn active px-5 py-2 rounded-lg bg-primary-600 text-white font-medium" data-filter="all">
                    All
                </button>
                <button class="filter-btn px-5 py-2 rounded-lg bg-dark-800 border border-dark-700 text-gray-400 hover:text-white" data-filter="web">
                    Web
                </button>
                <button class="filter-btn px-5 py-2 rounded-lg bg-dark-800 border border-dark-700 text-gray-400 hover:text-white" data-filter="mobile">
                    Mobile
                </button>
                <button class="filter-btn px-5 py-2 rounded-lg bg-dark-800 border border-dark-700 text-gray-400 hover:text-white" data-filter="ai">
                    AI / ML
                </button>
            </div>
        </div>
    </section>

    <!-- Projects Grid -->
    <section class="pb-32">
        <div class="max-w-7xl mx-auto px-4">
            <script src="components/project-card.js"></script>

            <div id="projects-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- All projects injected via JS -->
            </div>
        </div>
    </section>

    <!-- CTA -->
    <section class="py-24 bg-dark-800/40 border-t border-dark-700">
        <div class="max-w-4xl mx-auto text-center px-4">
            <h2 class="text-4xl md:text-5xl font-bold mb-6">
                Want to build something <span class="text-primary-500">awesome?</span>
            </h2>
            <p class="text-gray-400 mb-10">
                Join DevSoc and collaborate on real projects with passionate developers.
            </p>
            <a href="index.html#join" class="inline-flex items-center gap-2 px-8 py-4 bg-primary-600 rounded-lg text-white font-semibold hover:scale-105 transition">
                Join DevSoc
                <i data-feather="arrow-right"></i>
            </a>
        </div>
    </section>

    <!-- Footer -->
    <script src="components/footer.js"></script>
    <devsoc-footer></devsoc-footer>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script>feather.replace();</script>

</body>
</html>
